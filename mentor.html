<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor - AEC Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar bg-wa sticky-top shadow-sm p-0" style="z-index: 1020;">
        <div class="container-fluid px-3 pt-3 pb-2 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <i class="bi bi-person-circle fs-2 me-2 text-white"></i> 
                <div class="d-flex flex-column" style="line-height: 1.2;">
                    <span class="fw-bold text-white" style="font-size: 1.1rem;" id="userNameDisplay">Mentor</span>
                    <span style="font-size: 0.75rem; color: rgba(255,255,255,0.8);">Online • Area Mentor</span>
                </div>
            </div>
            <div class="dropdown">
                <i class="bi bi-three-dots-vertical fs-4 text-white" data-bs-toggle="dropdown" style="cursor:pointer;"></i>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2 p-2" style="border-radius: 12px; min-width: 220px;">
                    <li><h6 class="dropdown-header text-wa fw-bold text-xs">PENGATURAN</h6></li>
                    <li><a class="dropdown-item fw-medium py-2 rounded" href="#" data-bs-toggle="modal" data-bs-target="#modalTema"><i class="bi bi-palette-fill me-2 text-secondary"></i> Tema</a></li>
                    <li><a class="dropdown-item fw-medium py-2 rounded" href="#" data-bs-toggle="modal" data-bs-target="#modalRoadmap"><i class="bi bi-signpost-split-fill me-2 text-info"></i> Roadmap</a></li>
                    <li><a class="dropdown-item fw-medium py-2 rounded" href="#" data-bs-toggle="modal" data-bs-target="#modalPanduan"><i class="bi bi-book-half me-2 text-success"></i> Panduan</a></li>
                    <li><a class="dropdown-item fw-medium py-2 rounded" href="#" data-bs-toggle="modal" data-bs-target="#modalTentang"><i class="bi bi-info-circle-fill me-2 text-primary"></i> Tentang</a></li>
                    <li><a class="dropdown-item fw-medium py-2 rounded" href="#" data-bs-toggle="modal" data-bs-target="#modalLapor"><i class="bi bi-headset me-2 text-warning"></i> Lapor Admin</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger fw-bold py-2 rounded bg-danger bg-opacity-10 text-center" href="#" id="btnLogout"><i class="bi bi-power me-1"></i> LOGOUT</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-3">
        <div class="tab-content">
            <div class="tab-pane fade show active" id="beranda">
                <div class="card card-custom p-3"><h5>Beranda Mentor</h5><p>Isi konten mentor ning kene...</p></div>
            </div>
            <div class="tab-pane fade" id="logbook">
                <div class="card card-custom p-3"><h5>Logbook</h5><p>Isi logbook ning kene...</p></div>
            </div>
            </div>
    </div>

    <nav class="wa-bottom-nav" role="tablist">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#beranda"><i class="bi bi-house-door-fill"></i> INFO</button>
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#logbook"><i class="bi bi-pencil-square"></i> LOGBOOK</button>
        <button class="nav-link"><i class="bi bi-chat-fill"></i> CHAT</button>
        <button class="nav-link"><i class="bi bi-whatsapp"></i> WA</button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { initGlobalUI } from './script.js?v=4.0';
        
        // Inisialisasi UI (Suntik modal otomatis & Logic Global)
        initGlobalUI();
        
        // Tampilke jeneng user
        document.getElementById('userNameDisplay').innerText = localStorage.getItem('loggedInName') || 'Mentor';
    </script>
</body>
</html>
