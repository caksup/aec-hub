<!-- ==================================================
     mentor.html - AEC HUB (Panel Mentor)
     
     Riwayat Versi (HTML):
     - v4.1: Penambahan Timeline Roadmap di Tab Info.
     - v4.0 Ultimate: Rombak UI Tersentralisasi, link khusus mt.css & mt.js, Menu Bawah Adaptif.
     ================================================== -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Mentor - AEC Hub</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#128C7E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="mt.css">
</head>
<body>
    <div class="app-wrapper">
        <nav class="navbar bg-wa sticky-top shadow-sm p-0" style="z-index: 1020;">
            <div class="container-fluid px-3 pt-3 pb-2 d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <i class="bi bi-person-circle fs-2 me-2 text-white"></i> 
                    <div class="d-flex flex-column" style="line-height: 1.2;">
                        <span class="fw-bold text-white" style="font-size: 1.1rem;" id="userNameDisplay">Memuat...</span>
                        <span style="font-size: 0.75rem; color: rgba(255,255,255,0.8);"><span id="netStatus"></span> <span id="identitasMenu">Area Mentor</span></span>
                    </div>
                </div>
                
                <div class="dropdown">
                    <i class="bi bi-three-dots-vertical fs-4 text-white" data-bs-toggle="dropdown" style="cursor:pointer;"></i>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2 p-2" style="border-radius: 12px; min-width: 220px;">
                        <li><h6 class="dropdown-header text-wa fw-bold text-xs">PENGATURAN</h6></li>
                        <li><a class="dropdown-item fw-medium py-2 rounded mb-1" href="#" data-bs-toggle="modal" data-bs-target="#modalTema"><i class="bi bi-palette-fill me-2 text-secondary"></i> Tema Tampilan</a></li>
                        <li><a class="dropdown-item fw-medium py-2 rounded mb-1" href="#" data-bs-toggle="modal" data-bs-target="#modalPanduan"><i class="bi bi-book-half me-2 text-success"></i> Buku Panduan</a></li>
                        <li><a class="dropdown-item fw-medium py-2 rounded mb-1" href="#" data-bs-toggle="modal" data-bs-target="#modalTentang"><i class="bi bi-info-circle-fill me-2 text-primary"></i> Tentang Aplikasi</a></li>
                        <li><a class="dropdown-item fw-medium py-2 rounded mb-1" href="#" data-bs-toggle="modal" data-bs-target="#modalLapor"><i class="bi bi-headset me-2 text-warning"></i> Lapor Admin</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger fw-bold py-2 rounded bg-danger bg-opacity-10 text-center mt-2" href="#" id="btnLogout"><i class="bi bi-power me-1"></i> LOGOUT</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container pb-5 pt-3" id="mainContentArea">
            
            <div class="tab-content h-100">
                <!-- TAB INFO (DASHBOARD) -->
                <div class="tab-pane fade show active" id="info">
                    <div class="card card-custom p-3 border-start border-danger border-4 bg-white mb-3">
                        <h6 class="fw-bold text-danger mb-2 text-xs"><i class="bi bi-megaphone"></i> INFO TUGAS & JADWAL LIVE</h6>
                        <div id="tutorBriefing" class="text-sm">Memuat info...</div>
                    </div>
                    
                    <!-- ROADMAP MUNCUL NENG KENE -->
                    <div class="card card-custom p-3 border-start border-info border-4 bg-white shadow-sm mb-4">
                        <h6 class="fw-bold text-info mb-3"><i class="bi bi-signpost-split-fill me-2"></i> Roadmap Program AEC Hub</h6>
                        <ul class="timeline" id="infoRoadmap">
                            <li class="timeline-item"><div class="timeline-desc text-muted">Memuat...</div></li>
                        </ul>
                    </div>
                </div>

                <!-- TAB LOGBOOK (INPUT DATA) -->
                <div class="tab-pane fade" id="logbook"><div class="card card-custom p-3 bg-white border-top border-primary border-4 mb-3" id="formLogbook"><div class="text-center text-muted small">Memuat form...</div></div></div>
                
                <!-- TAB DISKUSI -->
                <div class="tab-pane fade h-100" id="chat"><div class="card card-custom h-100 d-flex flex-column border-0 bg-transparent shadow-none"><div id="chatBox" class="chat-box flex-grow-1 p-3 rounded-top mb-1 d-flex flex-column gap-2" style="min-height: 380px;"></div><div class="input-group bg-white p-2 rounded-bottom shadow-sm border"><input type="text" id="inputChat" class="form-control border-0 bg-light rounded-pill px-3" placeholder="Ketik pesan global..."><button class="btn btn-wa rounded-circle ms-1" id="btnSendChat" style="width: 40px; height: 40px; padding: 0;"><i class="bi bi-send-fill"></i></button></div></div></div>
                
                <!-- TAB TUGAS WA -->
                <div class="tab-pane fade" id="tugaswa"><div class="card card-custom p-3 bg-white"><h6 class="fw-bold text-success mb-3"><i class="bi bi-whatsapp me-2"></i> Penugasan WhatsApp</h6><div id="listTugasWAHarian" class="space-y-3" style="max-height: 400px; overflow-y: auto;">Memuat tugas...</div></div></div>

                <!-- TAB GUDANG MATERI -->
                <div class="tab-pane fade" id="gudang"><div class="card card-custom p-3 bg-white"><h6 class="fw-bold text-primary mb-3"><i class="bi bi-box-seam-fill me-2"></i> Gudang Materi Pembelajaran</h6><div id="listGudangMateri" class="overflow-auto" style="max-height: 400px;"><div class="text-center text-muted small mt-2">Memuat gudang materi...</div></div></div></div>
            </div>
        </div>

        <nav class="wa-bottom-nav" role="tablist">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#info"><i class="bi bi-display"></i><span class="tab-label">INFO</span></button>
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#logbook"><i class="bi bi-pencil-square"></i><span class="tab-label">LOGBOOK</span></button>
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#chat"><i class="bi bi-chat-fill"></i><span class="tab-label">CHAT</span></button>
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tugaswa"><i class="bi bi-whatsapp"></i><span class="tab-label">TUGAS</span></button>
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#gudang"><i class="bi bi-box-seam-fill"></i><span class="tab-label">MATERI</span></button>
        </nav>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="mt.js"></script>
</body>
</html>
