<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - AEC Hub</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#128C7E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-header-bg"></div>
    <div class="login-container">
        <div class="login-card text-center animate-pop">
            <i class="bi bi-chat-square-quote-fill text-wa mb-3 d-block" style="font-size: 3.5rem;"></i>
            <h4 class="fw-bold mb-1 text-dark">AEC Hub</h4>
            <p class="text-muted small mb-4">Sistem Manajemen Pengajaran Terpadu</p>
            
            <form id="loginForm">
                <div class="mb-3 text-start">
                    <label class="form-label text-xs fw-bold text-muted">ID PENGGUNA</label>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan ID Anda" required autocomplete="off">
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label text-xs fw-bold text-muted">PIN KEAMANAN</label>
                    <input type="password" id="pin" class="form-control" placeholder="Masukkan PIN 6 Digit" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-wa w-100" id="btnLogin">MASUK SISTEM</button>
            </form>
        </div>
    </div>

    <div class="modal fade" id="modernAlertModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content text-center p-4">
                <i id="alertIcon" class="bi bi-exclamation-circle-fill text-danger mb-3 d-block" style="font-size: 3rem;"></i>
                <h6 class="fw-bold text-dark" id="alertTitle">Peringatan</h6>
                <p class="text-muted small mb-4" id="alertMessage">Pesan.</p>
                <button type="button" class="btn btn-wa w-100 rounded-pill" data-bs-dismiss="modal">MENGERTI</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
